name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Lint and test
        run: |
          npm run lint
          npm test
      - name: Build debug APK
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: snappit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk snappit-daily.apk
          gh release create latest snappit-daily.apk \
            --title "1.0.$RUN_NUMBER" \
            --notes "Automatic build from main@$GITHUB_SHA" \
            --latest \
            || { gh release upload latest snappit-daily.apk --clobber; gh release edit latest --title "1.0.$RUN_NUMBER"; }
